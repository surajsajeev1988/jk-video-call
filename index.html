<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JK Video Call</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg1:#07061a; --bg2:#120a36; --ink:#f4f2ff; --dim:#b6b0dd; --faint:#7d77a8;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13); --edge:rgba(255,255,255,.18);
  --blue1:#7cc4ff; --blue2:#2f6bff; --vio1:#c69bff; --vio2:#7b3dff;
  --gold1:#ffe9a3; --gold2:#f2a922; --green1:#8dffb5; --green2:#10b458; --red1:#ff9a9a; --red2:#e3243b;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg1);color:var(--ink);font:15px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--ink)}

/* ---------- aurora background ---------- */
.sky{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:#3b2bff}
.b2{width:50vmax;height:50vmax;right:-20vmax;top:10vh;background:#b43dff;animation-delay:-6s}
.b3{width:45vmax;height:45vmax;left:10vw;bottom:-25vmax;background:#00b7ff;opacity:.35;animation-delay:-11s}
@keyframes float{to{transform:translate(6vmax,5vmax) scale(1.12)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff5,transparent),radial-gradient(1px 1px at 85% 60%,#fff7,transparent),radial-gradient(1px 1px at 10% 85%,#fff5,transparent),radial-gradient(1.5px 1.5px at 60% 45%,#fff4,transparent);}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 10px)}
@media (min-width:700px){.app{padding-top:28px;padding-bottom:24px}}
.glass{background:linear-gradient(160deg,var(--glass2),var(--glass) 55%);border:1px solid var(--edge);border-radius:var(--r);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.hidden{display:none!important}

/* glossy button base */
.gloss{position:relative;overflow:hidden;border-radius:999px;font-weight:600;letter-spacing:.2px;
  box-shadow:0 8px 22px var(--sh,rgba(0,0,0,.35)),inset 0 -3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s,filter .2s}
.gloss::before{content:"";position:absolute;left:6%;right:6%;top:2px;height:48%;border-radius:999px 999px 60% 60%/999px 999px 40% 40%;
  background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.05));pointer-events:none}
.gloss::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,70%{left:-60%}100%{left:130%}}
.gloss:active{transform:scale(.94);filter:brightness(1.1)}
.g-blue{background:linear-gradient(180deg,var(--blue1),var(--blue2));--sh:rgba(47,107,255,.5)}
.g-vio{background:linear-gradient(180deg,var(--vio1),var(--vio2));--sh:rgba(123,61,255,.5)}
.g-green{background:linear-gradient(180deg,var(--green1),var(--green2));--sh:rgba(16,180,88,.55);color:#04240f}
.g-red{background:linear-gradient(180deg,var(--red1),var(--red2));--sh:rgba(227,36,59,.55)}
.g-gold{background:linear-gradient(180deg,var(--gold1),var(--gold2));--sh:rgba(242,169,34,.5);color:#3a2300}
.g-glass{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid var(--edge);--sh:rgba(0,0,0,.3)}
.g-on{background:linear-gradient(180deg,#fff,#cfd3ff);color:#1a1446}

/* avatar orbs */
.orb{position:relative;display:grid;place-items:center;border-radius:50%;font-weight:800;color:#fff;flex:none;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.85),rgba(255,255,255,0) 32%),linear-gradient(160deg,var(--c1,#7cc4ff),var(--c2,#2f6bff));
  box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 -6px 14px rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.6);text-shadow:0 2px 6px rgba(0,0,0,.35)}
.orb.k{--c1:#7ce8ff;--c2:#2344ff}
.orb.j{--c1:#ffd36b;--c2:#ff5a2b}
.orb.x{--c1:#d4a8ff;--c2:#7b3dff}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.top .orb{width:48px;height:48px;font-size:20px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:#888;box-shadow:0 0 0 3px rgba(255,255,255,.06);flex:none}
.dot.on{background:#3dff8d;box-shadow:0 0 10px #3dff8d}
.dot.wait{background:#ffc53d;animation:blink 1s infinite}
.dot.off{background:#ff4d5e}
@keyframes blink{50%{opacity:.3}}
.mynum{padding:8px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.mynum small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;opacity:.7}
.mynum span{font-size:22px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* ---------- tabs / pages ---------- */
.pages{flex:1;min-height:0;margin-top:14px;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:2px 2px 12px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;padding:6px;margin-top:10px}
.tab{flex:1;padding:10px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--dim);transition:.2s}
.tab svg{width:22px;height:22px}
.tab.active{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.25)}

h2{margin:6px 6px 12px;font-size:13px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);font-weight:700}

/* keypad */
.display{padding:18px 14px 14px;text-align:center}
.slots{display:flex;justify-content:center;gap:12px}
.slot{width:54px;height:66px;border-radius:16px;display:grid;place-items:center;font-size:34px;font-weight:800;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(255,255,255,.06));border:1px solid var(--edge);box-shadow:inset 0 3px 10px rgba(0,0,0,.4)}
.slot.fill{background:linear-gradient(180deg,rgba(124,196,255,.35),rgba(123,61,255,.25));text-shadow:0 0 14px rgba(150,200,255,.9)}
.match{margin-top:10px;min-height:20px;color:var(--gold1);font-weight:600}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 18px 6px;justify-items:center}
.key{width:min(76px,22vw);height:min(76px,22vw);border-radius:50%;font-size:28px;font-weight:600;
  background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.35),rgba(255,255,255,.05) 55%),rgba(255,255,255,.06);
  border:1px solid var(--edge);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .1s,background .2s}
.key:active{transform:scale(.9);background:rgba(124,196,255,.35)}
.key svg{width:26px;height:26px}
.callrow{display:flex;justify-content:center;gap:22px;padding:12px 0 4px}
.bigcall{width:72px;height:72px;display:grid;place-items:center}
.bigcall svg{width:30px;height:30px;position:relative;z-index:1}
.lbl{font-size:11.5px;color:var(--dim);text-align:center;margin-top:6px}

/* contacts */
.card{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px}
.card .orb{width:54px;height:54px;font-size:22px}
.card .meta{flex:1;min-width:0}
.card .meta b{display:block;font-size:17px}
.card .meta span{color:var(--dim);letter-spacing:2px;font-variant-numeric:tabular-nums}
.card .meta span.need{color:var(--gold1);letter-spacing:0}
.mini{width:46px;height:46px;display:grid;place-items:center;flex:none}
.mini svg{width:21px;height:21px;position:relative;z-index:1}
.addbtn{width:100%;padding:14px;margin-top:4px}
.empty{text-align:center;color:var(--faint);padding:30px 10px}

/* recents */
.rec{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin-bottom:6px;background:rgba(255,255,255,.04)}
.rec .orb{width:40px;height:40px;font-size:16px}
.rec .meta{flex:1;min-width:0}
.rec .meta b{display:block}
.rec .meta span{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
.rec .meta span svg{width:14px;height:14px}
.rec.miss .meta b{color:#ff8a96}
.rec time{font-size:12px;color:var(--faint)}

/* ---------- setup ---------- */
.setup{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:10px}
.logo{font-size:30px;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,#fff,#b9c7ff 55%,#8f6bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(124,120,255,.6))}
.sub{color:var(--dim);max-width:320px}
.pick{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pickme{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px;width:148px;border-radius:26px;transition:transform .15s}
.pickme:active{transform:scale(.95)}
.pickme .orb{width:84px;height:84px;font-size:36px}
.pickme b{font-size:17px}
.other{display:flex;gap:8px;width:100%;max-width:320px}
.field{flex:1;padding:13px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(0,0,0,.25);outline:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.field:focus{border-color:var(--blue1)}
.other .gloss{padding:0 18px}

/* reveal number */
.reveal .numbig{font-size:64px;font-weight:900;letter-spacing:10px;padding:10px 26px 10px 36px;border-radius:26px;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.04));border:1px solid var(--edge);
  text-shadow:0 0 24px rgba(160,190,255,.9);box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* ---------- call screen ---------- */
.call{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;overflow:hidden}
.call .backdrop{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,#2b1d7a,#090616 75%)}
.call .backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 30% at 30% 80%,rgba(0,183,255,.25),transparent),radial-gradient(40% 30% at 80% 20%,rgba(180,61,255,.3),transparent)}
#remoteV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
@media (min-aspect-ratio:4/3){#remoteV{object-fit:contain}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent 22%,transparent 70%,rgba(0,0,0,.6))}
.caller{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:calc(env(safe-area-inset-top) + 9vh);text-align:center;padding:0 16px}
.caller .orb{width:132px;height:132px;font-size:56px}
.caller .ringwrap{position:relative;display:grid;place-items:center}
.ringwrap i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(160,190,255,.6);animation:ripple 2.2s ease-out infinite}
.ringwrap i:nth-child(2){animation-delay:.7s}.ringwrap i:nth-child(3){animation-delay:1.4s}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(2.1);opacity:0}}
.ringwrap.still i{display:none}
.caller h1{margin:8px 0 0;font-size:32px;font-weight:800;text-shadow:0 3px 14px rgba(0,0,0,.5)}
.caller .cnum{letter-spacing:3px;color:var(--dim)}
.caller .cstate{font-size:16px;color:#dfe3ff;min-height:22px}
.call.live .caller{margin-top:calc(env(safe-area-inset-top) + 18px)}
.call.live.vid .caller h1{font-size:22px}
.call.live.vid .caller .cnum{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.call.live.vid .chips{justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--edge);font-size:13px;backdrop-filter:blur(10px)}
.chip svg{width:14px;height:14px}
.chip.q{font-weight:800;letter-spacing:.5px;background:linear-gradient(180deg,rgba(255,233,163,.35),rgba(242,169,34,.25));border-color:rgba(255,233,163,.5);color:var(--gold1)}

#localV{position:absolute;z-index:3;right:16px;top:calc(env(safe-area-inset-top) + 16px);width:min(30vw,170px);aspect-ratio:3/4;object-fit:cover;border-radius:18px;
  border:2px solid rgba(255,255,255,.55);box-shadow:0 12px 30px rgba(0,0,0,.5);background:#111;transform:scaleX(-1);transition:all .3s}
#localV.back{transform:none}
.call.pre #localV{inset:0;width:100%;height:100%;border-radius:0;border:0;right:0;top:0;z-index:0;opacity:.55}
.call.live.vid .caller{align-items:flex-start;padding-right:calc(min(30vw,170px) + 24px)}

.controls{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 26px);display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.cbtn{width:62px;height:62px;display:grid;place-items:center}
.cbtn svg{width:26px;height:26px;position:relative;z-index:1}
.cbtn.huge{width:76px;height:76px}
.cbtn.huge svg{width:32px;height:32px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#e8e6ff}
.incoming-row{gap:70px}
.wobble{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}

/* toast & modal */
.toast{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;
  padding:12px 18px;border-radius:16px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,3,20,.6);display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:380px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .row{display:flex;gap:10px}
.sheet .row .gloss{flex:1;padding:13px}
.sheet .field{border-radius:16px}
.sheet .note{font-size:13px;color:var(--dim)}
.sheet .plain{padding:12px;border-radius:14px;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.sheet .plain.danger{color:#ff8a96}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--edge)}
.seg button{padding:10px 2px;border-radius:12px;font-weight:700;font-size:13px;color:var(--dim)}
/* ---------- chat ---------- */
.tab{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:800;line-height:18px;color:#fff;
  background:linear-gradient(180deg,#ff8a9a,#e3243b);box-shadow:0 2px 8px rgba(227,36,59,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.card .meta{cursor:pointer}
.chatrow{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.chatrow .orb{width:50px;height:50px;font-size:21px}
.chatrow .meta{flex:1;min-width:0}
.chatrow .meta b{display:block;font-size:16.5px}
.chatrow .meta span{display:block;color:var(--dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatrow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--faint)}
.chatrow .side i{font-style:normal;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;font-weight:800;line-height:22px;text-align:center;color:#fff;
  background:linear-gradient(180deg,#8dffb5,#10b458);box-shadow:0 2px 8px rgba(16,180,88,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.chatrow.unread .meta span{color:#fff;font-weight:600}
.thread{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;background:rgba(7,6,26,.55);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%)}
.thWrap{width:100%;max-width:560px;height:100%;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}
.thHead{display:flex;align-items:center;gap:10px;padding:8px 10px}
.thHead .orb{width:42px;height:42px;font-size:18px}
.thHead .who b{font-size:16.5px}
.thHead .who span{font-size:12.5px;color:var(--dim);letter-spacing:1px}
.thHead .mini{width:42px;height:42px}
.msgs{flex:1;overflow-y:auto;padding:14px 4px 8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;user-select:text;-webkit-user-select:text}
.msgs::-webkit-scrollbar{display:none}
.bub{position:relative;max-width:78%;padding:9px 13px 7px;border-radius:20px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;font-size:15.5px;line-height:1.35;animation:bubIn .25s ease-out}
@keyframes bubIn{from{transform:translateY(8px) scale(.96);opacity:0}}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px;background:linear-gradient(170deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.2)}
.bub.mine{align-self:flex-end;border-bottom-right-radius:6px;background:linear-gradient(170deg,#7cb8ff,#5b3dff);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 12px rgba(0,0,0,.15),0 6px 18px rgba(91,61,255,.4)}
.bub.mine::before{content:"";position:absolute;left:10px;right:10px;top:2px;height:45%;max-height:22px;border-radius:16px;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.bub.big{font-size:38px;line-height:1.1;background:none!important;border:0!important;box-shadow:none!important;padding:2px 4px}
.bub.big::before{display:none}
.bub small{display:block;text-align:right;font-size:10.5px;opacity:.75;margin-top:2px;white-space:nowrap}
.bub small b{font-weight:800;letter-spacing:-2px;margin-left:4px}
.bub small b.read{color:#9ff3ff;text-shadow:0 0 6px rgba(159,243,255,.8)}
.daysep{align-self:center;font-size:11.5px;color:var(--dim);padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.07);margin:8px 0 4px}
.pendnote{align-self:center;font-size:12px;color:var(--gold1);margin-top:4px}
.quick{display:flex;gap:8px;justify-content:center;padding:6px 0}

.composer{display:flex;gap:8px;padding:7px;border-radius:999px}
.composer .field{border:0;background:rgba(0,0,0,.28);user-select:text;-webkit-user-select:text}
.send{width:48px;height:48px;display:grid;place-items:center;flex:none}

.seg button.on{color:#3a2300;background:linear-gradient(180deg,var(--gold1),var(--gold2));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(242,169,34,.4)}

/* ================= WhatsApp-style theme (overrides the rules above) ================= */
:root{--bg1:#0b141a;--bg2:#111b21;--ink:#e9edef;--dim:#8696a0;--faint:#667781;--glass:#202c33;--glass2:#202c33;--edge:rgba(134,150,160,.18);
  --blue1:#25d366;--blue2:#00a884;--green1:#25d366;--green2:#00a884;--vio1:#3b4a54;--vio2:#2a3942;--gold1:#d9fdd3;--gold2:#00a884;--r:14px}
body,.sky{background:#0b141a}
.blob,.stars{display:none}
.glass{background:#202c33;border:1px solid var(--edge);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.gloss{box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)}
.gloss::before{opacity:.3}
.gloss::after{display:none}
.g-gold,.g-blue,.g-green{color:#04240f}
.g-glass{background:#2a3942;border-color:transparent}
.g-on{background:#e9edef;color:#111b21}
.g-red{background:linear-gradient(180deg,#ff7a85,#ea0038)}
.orb{background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:none;text-shadow:none}
.orb.k{--c1:#53bdeb;--c2:#1f7aec}.orb.j{--c1:#ffb74d;--c2:#f4511e}.orb.x{--c1:#b39ddb;--c2:#7e57c2}
.app{max-width:620px;padding:env(safe-area-inset-top) 0 0}
@media (min-width:700px){.app{padding-top:0;padding-bottom:0;border-left:1px solid var(--edge);border-right:1px solid var(--edge)}}
.top{border-radius:0;border:0;background:#111b21;box-shadow:none;padding:12px 14px}
.top .who b{font-size:19px}
.pages{margin-top:0}
.page{padding:4px 10px 12px}
h2{margin:12px 6px 6px;color:#00a884;letter-spacing:.6px;font-size:12.5px}
.tabs{border-radius:0;border:0;border-top:1px solid var(--edge);background:#111b21;box-shadow:none;margin-top:0;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tab{font-size:12.5px;font-weight:600}
.tab.active{background:none;box-shadow:none;color:#e9edef}
.tab.active svg{background:#103629;color:#d9fdd3;border-radius:16px;padding:3px 18px;width:64px;height:30px;box-sizing:border-box}
.tab svg{height:30px;padding:3px 0;box-sizing:border-box}
.badge{background:#00a884;color:#04240f;box-shadow:none;left:calc(50% + 10px);top:2px}
.chatrow,.card,.rec{background:none;border:0;border-radius:0;box-shadow:none;margin:0;padding:12px 6px;border-bottom:1px solid rgba(134,150,160,.1)}
.chatrow:active,.rec:active{background:#182229}
.chatrow .side i{background:#00a884;color:#04240f;box-shadow:none}
.chatrow.unread .side{color:#00a884}
.card .meta span.need{color:#00a884}
.rec.miss .meta b,.sheet .plain.danger{color:#f15c6d}
.addbtn{margin-top:14px}
.display{margin-top:10px}
.slot{background:#111b21;box-shadow:none}
.slot.fill{background:#005c4b;text-shadow:none}
.match{color:#00a884}
.key{background:#202c33;border:0;box-shadow:none}
.key:active{background:#00a884}
.logo{background:none;color:#00a884;-webkit-text-fill-color:#00a884;filter:none}
.reveal .numbig{background:#202c33;text-shadow:none;box-shadow:none}
.field{background:#2a3942;border-color:transparent;box-shadow:none}
.field:focus{border-color:#00a884}
.pickme{background:#202c33}
.seg{background:#111b21}
.seg button.on{background:#00a884;color:#04240f;box-shadow:none}
.sheet .plain{background:#2a3942;border-color:transparent}
.modal{background:rgba(11,20,26,.8);backdrop-filter:none}
.toast{background:#2a3942;box-shadow:0 6px 20px rgba(0,0,0,.5)}
/* chat screen */
.thread{background:#0b141a;backdrop-filter:none;-webkit-backdrop-filter:none}
.thWrap{padding:0;max-width:820px}
@media (min-width:860px){.thWrap{border-left:1px solid var(--edge);border-right:1px solid var(--edge)}}
.thHead{border-radius:0;border:0;background:#202c33;box-shadow:none;padding:calc(env(safe-area-inset-top) + 8px) 6px 8px;gap:6px}
.thHead .iconbtn,.thHead .mini{background:none;box-shadow:none;border:0;color:#e9edef;width:44px;height:44px}
.thHead .iconbtn::before,.thHead .mini::before{display:none}
.thHead .mini svg,.thHead .iconbtn svg{width:23px;height:23px}
.thHead .who span{letter-spacing:0}
.thHead .who span.online{color:#00a884}
.msgs{padding:10px 16px 8px;gap:3px;background-color:#0b141a;background-image:radial-gradient(rgba(134,150,160,.08) 1.5px,transparent 1.5px);background-size:22px 22px}
.bub{border-radius:9px;padding:6px 9px 5px;font-size:15px;max-width:80%;box-shadow:0 1px .5px rgba(0,0,0,.4)}
.bub.them{background:#202c33;border:0;border-top-left-radius:0;box-shadow:0 1px .5px rgba(0,0,0,.4)}
.bub.mine{background:#005c4b;border-top-right-radius:0;box-shadow:0 1px .5px rgba(0,0,0,.4)}
.bub.mine::before{left:auto;right:-8px;top:0;width:0;height:0;max-height:none;border-radius:0;background:none;border-left:8px solid #005c4b;border-bottom:10px solid transparent}
.bub.them::before{content:"";position:absolute;left:-8px;top:0;width:0;height:0;border-right:8px solid #202c33;border-bottom:10px solid transparent}
.bub.big::before{display:none}
.bub small{font-size:11px;color:rgba(233,237,239,.6);opacity:1;margin-top:1px}
.bub small b{color:#8696a0}
.bub small b.read{color:#53bdeb;text-shadow:none}
.bub.cmsg{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px 6px;min-width:200px;white-space:normal}
.bub.cmsg .ci{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none;color:#00a884}
.bub.cmsg.mine .ci{color:#d9fdd3}
.bub.cmsg.missed .ci{color:#f15c6d}
.bub.cmsg .ci svg{width:19px;height:19px}
.bub.cmsg .ct{flex:1}
.bub.cmsg .ct b{display:block;font-size:14.5px;font-weight:600}
.bub.cmsg .ct span{font-size:12.5px;color:rgba(233,237,239,.65)}
.daysep{background:#182229;color:#8696a0;border-radius:8px;box-shadow:0 1px .5px rgba(0,0,0,.4)}
.pendnote{color:#8696a0}
.quick{padding:6px 0 2px}
.quick button{background:#202c33;border:0}
.composer{border-radius:0;border:0;background:none;box-shadow:none;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px)}
.composer .field{background:#202c33;border-radius:24px;padding:12px 18px}
.send{background:#00a884;color:#04240f;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.send::before{display:none}
/* call screen */
.call .backdrop{background:radial-gradient(90% 60% at 50% 30%,#12332c,#0b141a 75%)}
.call .backdrop::after{display:none}
.ringwrap i{border-color:rgba(0,168,132,.6)}
.chip.q{background:rgba(0,0,0,.45);border-color:var(--edge);color:#e9edef}
.tab[data-pg=chats]{order:1}.tab[data-pg=recents]{order:2}.tab[data-pg=keypad]{order:3}.tab[data-pg=contacts]{order:4}
.login{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.login .field{border-radius:16px;text-align:center;font-size:19px;letter-spacing:4px;padding:14px}
.login .field::placeholder{letter-spacing:0;font-size:15px}
.login .gloss{padding:14px;font-weight:700;font-size:16px}
.login .gloss:disabled{opacity:.5}
#lgMsg{min-height:20px;color:#f15c6d;font-size:13.5px}
.orb.s{--c1:#4dd0a5;--c2:#00796b}.orb.t{--c1:#f48fb1;--c2:#c2185b}
.pickme{width:120px;padding:14px 10px}
.pickme .orb{width:64px;height:64px;font-size:28px}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:340px}
.people .pickme{width:auto;padding:16px 8px 12px;border-radius:22px;background:#202c33}
.people .pickme b{font-size:17px}
.av{width:92px;height:92px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.av svg{width:100%;height:100%;display:block}
.av.big{width:104px;height:104px}
.pins{display:flex;gap:14px;margin:6px 0 2px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid #8696a0;transition:.15s}
.pins i.on{background:#00a884;border-color:#00a884;transform:scale(1.15)}
.pinmsg{min-height:20px;font-size:13.5px;color:#f15c6d}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:270px}
.pinpad button{height:58px;border-radius:16px;font-size:24px;font-weight:600;background:#2a3942;transition:transform .08s,background .15s}
.pinpad button:active{transform:scale(.93);background:#00a884}
.pinpad button[data-k="x"]{font-size:14px;color:#8696a0;background:none}
.pinpad button[data-k="<"]{background:none}
.nbar{display:flex;align-items:center;gap:10px;margin:8px 4px 2px;padding:10px 12px;border-radius:14px;background:#103629;color:#d9fdd3;font-size:13.5px;line-height:1.35}
.nbar span{flex:1}
.nbar .gloss{padding:9px 14px;font-size:13.5px;font-weight:700;flex:none}
/* ================= personal themes (body.th-*) ================= */

/* ---------- top tabs: Account / Settings / Theme ---------- */
.toptabs{display:flex;gap:6px;margin:8px 10px 0;padding:5px;border-radius:18px;background:#202c33;border:1px solid var(--edge)}
.toptabs button{flex:1;padding:9px 4px;border-radius:13px;font-size:13.5px;font-weight:700;color:var(--ink);background:rgba(127,127,127,.13);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.toptabs button:active{transform:scale(.95)}
.toptabs button span{font-size:16px}
body.th-j .toptabs{background:rgba(18,8,44,.8);border:1.5px solid rgba(200,120,255,.9);animation:jglow 6s linear infinite}

body.th-t .toptabs button{border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05))}
/* theme picker */
.thgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thsw{display:flex;flex-direction:column;gap:5px;align-items:center;padding:6px 6px 8px;border-radius:14px;background:rgba(127,127,127,.12);border:2.5px solid transparent;color:var(--ink);transition:transform .1s}
.thsw:active{transform:scale(.95)}
.thsw.on{border-color:var(--ink)}
.thsw b{font-size:12.5px;line-height:1.15;text-align:center}
.thsw small{font-size:10px;opacity:.7;margin-top:-3px}
.thprev{position:relative;display:block;width:100%;height:58px;border-radius:10px;overflow:hidden;border:1px solid rgba(127,127,127,.35)}
.thprev i{position:absolute;height:12px;border-radius:7px}
.thprev i:nth-child(1){left:7px;top:12px;width:55%}
.thprev i:nth-child(2){right:7px;bottom:12px;width:50%}

(() => {

/* ---------- state ---------- */
let me = null;                             // {name, num, pin} once logged in
let contacts = [];                          // [{id,name,num}]
let recents = [];
let chats = {};         // {num: {name, unread, msgs:[{id,me,text,ts,st}]}}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initial = n => (n || '?').trim().charAt(0).toUpperCase() || '?';

const rand4 = () => String(1000 + Math.floor(Math.random() * 9000));

function toast(msg, ms = 2600) {

/* ---------- sounds ---------- */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, audio, { passive: true }));
let toneT = 0;
function beep(freqs, dur, vol = 0.12, type = 'sine', when = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + when, g = a.createGain();
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02);

function stopTone() { clearInterval(toneT); toneT = 0; if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(0); }
function ringback() { stopTone(); const r = () => beep([440, 480], 1.6, 0.07); r(); toneT = setInterval(r, 4000); }

function piano(freq, when, dur = 1.2, vol = 0.22) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + when;
  [[1, 1], [2, 0.45], [3, 0.22], [4, 0.1]].forEach(([h, g]) => {

const canBuzz = () => navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive);

  const N = { C4: 261.63, E4: 329.63, G4: 392, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, D6: 1174.66, E6: 1318.51 };

const endTone = () => { beep([480, 620], 0.25, 0.08); beep([480, 620], 0.25, 0.08, 'sine', 0.35); };

}
const PEOPLE = [
  { num: '2017', name: 'Jagannath', av: 'boy' },

/* simple drawn faces: boy, girl, man, woman */
function avatar(kind) {

  else if (kind === 'man') s = bg('#4db6ac') + body('#37474f') + face(26) + `<path d="M24 47 Q21 22 50 22 Q79 22 76 47 Q70 33 50 34 Q30 33 24 47Z" fill="${hair}"/>` + eyes(52, 3) + `<path d="M39 64 Q50 58 61 64 Q50 68 39 64Z" fill="${hair}"/>` + smile(68);

      p.encodings[0].maxBitrate = Math.round(q.mbps * 1e6);
      p.encodings[0].maxFramerate = 30;
      p.encodings[0].scaleResolutionDownBy = 1;
      p.degradationPreference = 'maintain-resolution';
      await s.setParameters(p);
    } catch (e) {}
  }
}
function mediaError(e) {
  if (e && e.message === 'insecure') return 'Camera needs a secure (https) page on this device';
  if (e && e.name === 'NotAllowedError') return 'Please allow the camera and microphone';
  if (e && e.name === 'NotFoundError') return 'No microphone found';
  return 'Could not start camera or microphone';
}
/* has the viewer blocked the microphone for this site? 'granted' | 'denied' | 'prompt' | 'unknown' */
async function micState() {
  try { return (await navigator.permissions.query({ name: 'microphone' })).state; } catch (e) { return 'unknown'; }
}
/* the app's own link: a normal https page, where the browser is allowed to ask for camera and microphone */
const HOME_URL = 'https://surajsajeev1988.github.io/jk-video-call/';
function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }
function showMediaHelp(e) {
  const blocked = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError' || e.message === 'insecure');
  if (!blocked) return toast(mediaError(e), 4000);
  return permPopup(e.message === 'insecure');
}
/* "open settings and enable microphone": shown whenever a call cannot use the microphone */
function permPopup(framed) {
  const android = /Android/i.test(navigator.userAgent);
  notify('🎤 Microphone is blocked', { body: 'Open settings and allow the microphone to make calls.', tag: 'jk-perm', renotify: true });
  if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) { try { navigator.vibrate([120, 60, 120]); } catch (e) {} }
  const body = (inFrame() || framed)
    ? `<div class="note">This link can't use the camera or microphone, so calls don't work here (chat still does). No phone setting can change that. Open the app from its own link instead:</div>
       <a class="gloss g-green" style="padding:13px;text-align:center;text-decoration:none;font-weight:700" href="${HOME_URL}" target="_blank" rel="noopener">Open JK Video Call</a>
       <div class="note help"><a href="${HOME_URL}" target="_blank" rel="noopener">${HOME_URL}</a><br><br>You get a new 4-digit number on that link, so share it again.</div>`
    : `<div class="help"><ol>
        <li>Tap the <b>lock</b> or <b>⚙</b> icon at the left of the web address above, open <b>Permissions</b> (or <b>Site settings</b>), set <b>Microphone</b> and <b>Camera</b> to <b>Allow</b>, then reload this page.</li>
        <li><b>${android ? 'On this phone' : 'Android'}:</b> if nothing happens, open <b>Settings → Apps → Chrome → Permissions</b> and allow <b>Microphone</b> and <b>Camera</b>.</li>
        <li><b>iPhone:</b> open <b>Settings → Chrome</b> (or Safari) and turn on <b>Microphone</b> and <b>Camera</b>.</li>
        <li>If the app was added to the Home Screen, allow it there too, then open it again.</li>
       </ol></div>`;
  modal(`<h3>🎤 Allow the microphone</h3><div class="note">A call needs the microphone${isIOS ? '' : ' (and the camera for video)'}. It is switched off for this app right now.</div>${body}
    <button class="gloss g-green" style="padding:13px" id="mhAgain">Ask again</button>
    <button class="gloss g-glass" style="padding:12px" id="mhClose">Close</button>`);
  $('mhClose').onclick = closeModal;
  $('mhAgain').onclick = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(x => x.stop());
      closeModal(); clearNotif('jk-perm'); toast('Microphone is on. You can call now.');
    } catch (e2) { toast('Still blocked — use the steps above, then reload.', 4500); }
  };
}
const hasVideo = s => !!(s && s.getVideoTracks().length);
function stopLocal() { if (local) local.getTracks().forEach(t => t.stop()); local = null; }

/* ---------- call UI ---------- */
function openCallUI(state) {
  closeThread();
  const scr = $('call'); scr.classList.remove('hidden');
  scr.className = 'call ' + state + (call.video ? ' vid' : '');
  $('cName').textContent = call.name; $('cNum').textContent = call.num;
  const o = $('cOrb'); o.textContent = initial(call.name); o.className = 'orb ' + orbCls(call.name);
  $('ringwrap').classList.toggle('still', state === 'live');
  $('cMuted').classList.add('hidden'); $('cQual').classList.add('hidden');
  renderControls(state);
}
function cState(t) { $('cState').textContent = t; }
function showLocal() {
  const v = $('localV');
  if (hasVideo(local)) { v.srcObject = local; v.classList.remove('hidden'); v.classList.toggle('back', call.facing === 'environment'); v.play().catch(() => {}); }
  else v.classList.add('hidden');
}
function ctl(id, cls, icon, label, huge) {
  return `<div class="ctl"><button class="cbtn gloss ${cls} ${huge ? 'huge' : ''}" id="${id}">${icon}</button>${label}</div>`;
}
function renderControls(state) {
  const box = $('ctlOut'); box.classList.remove('incoming-row');
  if (state === 'incoming') {
    box.classList.add('incoming-row');
    box.innerHTML = ctl('bDecline', 'g-red', I.hang, 'Decline', true) + ctl('bAccept', 'g-green wobble', call.video ? I.video : I.phone, 'Accept', true);
    $('bDecline').onclick = decline; $('bAccept').onclick = accept;
    return;
  }
  let h = ctl('bMute', call.muted ? 'g-on' : 'g-glass', call.muted ? I.micOff : I.mic, call.muted ? 'Unmute' : 'Mute');
  if (hasVideo(local)) {
    h += ctl('bCam', call.camOff ? 'g-on' : 'g-glass', call.camOff ? I.camOff : I.cam, call.camOff ? 'Camera on' : 'Camera off');
    h += ctl('bFlip', 'g-glass', I.flip, 'Flip');
  }
  h += ctl('bChat', 'g-glass', I.chat, 'Chat');
  h += ctl('bEnd', 'g-red', I.hang, 'End');
  box.innerHTML = h;
  $('bChat').onclick = () => { if (call) openThread(call.num); };
  $('bMute').onclick = toggleMute; $('bEnd').onclick = () => finish('Call ended', call.live ? 'ok' : 'missed', true);
  if ($('bCam')) { $('bCam').onclick = toggleCam; $('bFlip').onclick = flipCam; }
}
function toggleMute() {
  if (!call) return; call.muted = !call.muted;
  if (local) local.getAudioTracks().forEach(t => t.enabled = !call.muted);
  send({ t: 'mute', on: call.muted }); renderControls(call.live ? 'live' : 'pre');
}
function toggleCam() {
  if (!call) return; call.camOff = !call.camOff;
  if (local) local.getVideoTracks().forEach(t => t.enabled = !call.camOff);
  $('localV').style.opacity = call.camOff ? '.25' : '';
  send({ t: 'cam', on: !call.camOff }); renderControls(call.live ? 'live' : 'pre');
}
async function flipCam() {
  if (!call || !local) return;
  const facing = call.facing === 'environment' ? 'user' : 'environment';
  try {
    const c = videoConstraints({ exact: facing });
    const s = await navigator.mediaDevices.getUserMedia({ video: c });
    tune(s);
    const nt = s.getVideoTracks()[0]; if (!nt) return;
    const old = local.getVideoTracks()[0];
    if (call.mc && call.mc.peerConnection) {
      const sender = call.mc.peerConnection.getSenders().find(x => x.track && x.track.kind === 'video');
      if (sender) await sender.replaceTrack(nt);
    }
    if (old) { local.removeTrack(old); old.stop(); }
    nt.enabled = !call.camOff; local.addTrack(nt); call.facing = facing; showLocal();
  } catch (e) { toast('No other camera on this device'); }
}
function setRemoteCam(on) { if (!call) return; call.remoteCamOff = !on; updateRemoteView(); }
function updateRemoteView() {
  const scr = $('call'), rv = $('remoteV');
  const show = call && call.live && call.remoteStream && hasVideo(call.remoteStream) && !call.remoteCamOff;
  rv.classList.toggle('hidden', !show);
  scr.classList.toggle('vid', !!show);
  $('ringwrap').style.display = show ? 'none' : '';
  $('cQual').classList.toggle('hidden', !show || !rv.videoWidth);
}

/* ---------- call flow ---------- */
function send(m) { try { if (call && call.conn && call.conn.open) call.conn.send(m); } catch (e) {} }

async function dial(num, video) {
  if (call) return;
  if (!/^\d{4}$/.test(num || '')) return toast('Pick a 4-digit number');
  if (num === me.num) return toast("You can't call your own number");
  if (!peerReady) return toast('Still connecting… try again in a moment');
  if (await micState() === 'denied') { permPopup(false); return; }
  call = { num, name: nameFor(num), video, dir: 'out', facing: 'user', muted: false, camOff: false };
  openCallUI('pre'); cState('Starting ' + (video ? 'camera' : 'microphone') + '…');
  try { local = await getMedia(video); }
  catch (e) {
    call = null; $('call').classList.add('hidden');
    const back = returnThread; returnThread = null; if (back) openThread(back);
    return showMediaHelp(e);
  }
  if (!call) { stopLocal(); return; }
  if (video && !hasVideo(local)) { call.video = false; toast('No camera found — audio call instead'); }
  showLocal(); renderControls('pre');
  cState('Calling…'); ringback();
  const c = peer.connect(PREFIX + num, { reliable: true, metadata: { name: me.name, num: me.num } });
  call.conn = c; wireConn(c);
  c.on('open', () => { if (call && call.conn === c) { c.send({ t: 'ring', name: me.name, num: me.num, video: call.video }); cState('Ringing…'); } });
  call.noAnswer = setTimeout(() => { if (call && !call.live) finish('No answer', 'missed', true); }, 60000);
  call.reachT = setTimeout(() => { if (call && call.dir === 'out' && !(call.conn && call.conn.open)) wakeCall(); }, 8000);
}

function wireConn(c) {
  c.on('data', d => onData(c, d));
  c.on('open', () => { c._opened = true; });
  c.on('close', () => { if (call && call.conn === c && (c._opened || c.open || call.dir === 'in')) finish('Call ended', call.live ? 'ok' : 'missed'); });
  c.on('error', () => {});
}

function onData(c, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'nudge') return cloudPoll();
  if (d.t === 'msg' || d.t === 'ack' || d.t === 'read') return onChatData(c, d);
  if (d.t === 'ring') {
    if (call) { try { c.send({ t: 'busy' }); } catch (e) {} setTimeout(() => c.close(), 800); return; }
    const num = String(d.num || '').replace(/\D/g, '').slice(0, 4);
    const saved = resolveContact(num, d.name);
    call = { num, name: saved ? saved.name : String(d.name || 'Someone').slice(0, 20), video: !!d.video, dir: 'in', conn: c, facing: 'user', muted: false, camOff: false, unknown: !saved };
    openCallUI('incoming');
    cState('Incoming ' + (call.video ? 'video' : 'audio') + ' call' + (saved ? '' : ' · not in contacts'));
    ringtone(); flashTitle(true);
    if (document.hidden) notify('📞 ' + call.name + ' is calling', {
      body: (call.video ? 'Video' : 'Voice') + ' call. Tap Accept to answer.', tag: 'jk-call', renotify: true, requireInteraction: true,
      vibrate: [600, 300, 600, 300, 600, 300, 600], actions: [{ action: 'accept', title: 'Accept' }, { action: 'decline', title: 'Decline' }], data: { kind: 'call', from: num }
    });
    call.noAnswer = setTimeout(() => { if (call && !call.live && call.dir === 'in') finish('Missed call', 'missed', true); }, 45000);
    return;
  }
  if (!call || call.conn !== c) return;
  switch (d.t) {
    case 'accept':
      if (call.dir !== 'out' || call.live) return;
      clearTimeout(call.noAnswer); stopTone(); cState('Connecting…');
      call.mc = peer.call(PREFIX + call.num, local, { metadata: { num: me.num } });
      wireMedia(call.mc);
      break;
    case 'decline': finish(call.name + ' declined the call', 'declined'); break;
    case 'busy': finish(call.name + ' is on another call', 'busy'); break;
    case 'end': finish('Call ended', call.live ? 'ok' : 'missed'); break;
    case 'cam': setRemoteCam(!!d.on); break;
    case 'mute': $('cMuted').classList.toggle('hidden', !d.on); $('cMuted').querySelector('span').textContent = call.name + ' muted'; break;
  }
}

async function accept() {
  if (!call || call.dir !== 'in') return;
  stopTone(); flashTitle(false); clearTimeout(call.noAnswer); clearNotif('jk-call');
  cState('Starting ' + (call.video ? 'camera' : 'microphone') + '…');
  try { local = await getMedia(call.video); }
  catch (e) { finish('Could not answer', 'missed', true); return showMediaHelp(e); }
  if (!call) { stopLocal(); return; }
  if (call.video && !hasVideo(local)) call.video = false;
  call.accepted = true;
  showLocal(); openCallUI('pre'); cState('Connecting…');
  send({ t: 'accept' });
  call.connT = setTimeout(() => { if (call && !call.live) finish('Could not connect — check the internet', 'unreached', true); }, 25000);
}
function decline() { if (!call) return; send({ t: 'decline' }); finish('Declined', 'declined'); }

function onMedia(mc) {
  if (!call || call.dir !== 'in' || !call.accepted || mc.peer !== PREFIX + call.num || !local) { try { mc.close(); } catch (e) {} return; }
  call.mc = mc; mc.answer(local); wireMedia(mc);
}
function wireMedia(mc) {
  mc.on('stream', rs => {
    if (!call || call.mc !== mc) return;
    call.remoteStream = rs;
    const rv = $('remoteV'), ra = $('remoteA');
    if (hasVideo(rs)) { rv.srcObject = rs; rv.muted = false; rv.play().catch(() => {}); ra.srcObject = null; }
    else { ra.srcObject = rs; ra.play().catch(() => {}); rv.srcObject = null; }
    goLive();
  });
  mc.on('close', () => { if (call && call.mc === mc) finish('Call ended', 'ok'); });
  mc.on('error', () => { if (call && call.mc === mc) finish('Connection lost', call.live ? 'ok' : 'unreached'); });
  const pc = mc.peerConnection;
  if (pc) pc.addEventListener('iceconnectionstatechange', () => {
    if (!call || call.mc !== mc) return;
    const st = pc.iceConnectionState;
    if (st === 'failed') finish('Connection lost', call.live ? 'ok' : 'unreached', true);
    else if (st === 'disconnected' && call.live) cState('Reconnecting…');
    else if (st === 'connected' || st === 'completed') { boostSender(pc); if (call.live) tick(); }
  });
}
let wake = null;
function goLive() {
  if (call.live) return;
  clearTimeout(call.connT); clearTimeout(call.reachT);
  call.live = true; call.start = Date.now();
  openCallUI('live'); showLocal(); updateRemoteView();
  if (call.mc) boostSender(call.mc.peerConnection);
  tick(); call.timer = setInterval(tick, 1000);
  beep([660, 880], 0.15, 0.06);
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wake = w, () => {}); } catch (e) {}
}
function tick() {
  if (!call || !call.live) return;
  cState(fmtDur((Date.now() - call.start) / 1000));
  const rv = $('remoteV'), q = $('cQual');
  const lab = resLabel(rv.videoWidth, rv.videoHeight);
  if (lab && !rv.classList.contains('hidden')) {
    q.textContent = lab + ' · ' + rv.videoWidth + '×' + rv.videoHeight; q.classList.remove('hidden');
    if (!call.bestQ || Math.max(rv.videoWidth, rv.videoHeight) > call.bestPx) { call.bestQ = lab; call.bestPx = Math.max(rv.videoWidth, rv.videoHeight); }
  } else q.classList.add('hidden');
}

function finish(reason, result, notify) {
  if (!call) return;
  const c = call; call = null;
  if (notify) { try { if (c.conn && c.conn.open) c.conn.send({ t: 'end' }); } catch (e) {} }
  clearTimeout(c.noAnswer); clearTimeout(c.reachT); clearTimeout(c.retryT); clearNotif('jk-call'); clearTimeout(c.connT); clearInterval(c.timer);
  stopTone(); flashTitle(false);
  const dur = c.live ? (Date.now() - c.start) / 1000 : 0;
  setTimeout(() => { try { c.mc && c.mc.close(); } catch (e) {} try { c.conn && c.conn.close(); } catch (e) {} }, 400);
  stopLocal();
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  addRecent({ num: c.num, name: c.name, dir: c.dir, video: c.video, result: c.live ? 'ok' : result, dur, q: c.bestQ || '', t: Date.now() });
  if (/^\d{4}$/.test(c.num)) {   // the call also appears inside the chat, like a message
    const ch = chatOf(c.num, c.name);
    ch.msgs.push({ id: 'call-' + Date.now().toString(36), me: c.dir === 'out', text: '', ts: Date.now(), st: 'sent', call: { video: !!c.video, result: c.live ? 'ok' : (result || 'missed'), dur } });
    if (!c.live && c.dir === 'in' && result === 'missed') ch.unread = (ch.unread || 0) + 1;
    saveChats();
  }
  const back = returnThread === c.num ? c.num : null; returnThread = null;
  endTone();
  $('cState').textContent = reason + (c.live ? ' · ' + fmtDur(dur) : '');
  $('ctlOut').innerHTML = '';
  $('cQual').classList.add('hidden'); $('cMuted').classList.add('hidden');
  $('remoteV').classList.add('hidden'); $('localV').classList.add('hidden');
  $('remoteV').srcObject = null; $('remoteA').srcObject = null; $('localV').srcObject = null; $('localV').style.opacity = '';
  $('ringwrap').classList.add('still'); $('ringwrap').style.display = '';
  $('call').classList.remove('vid', 'pre');
  setTimeout(() => {
    if (!call) { $('call').classList.add('hidden'); if (back && !threadNum) openThread(back); else if (threadNum) renderThread(true); }
    if (c.dir === 'in' && c.unknown && c.num && c.live) toast('Tip: save ' + c.name + ' (' + c.num + ') in Contacts', 3500);
  }, 1800);
}

let titleT = 0;
function flashTitle(on) {
  clearInterval(titleT); document.title = 'JK Video Call';
  if (on && call) { let f = 0; const n = call.name; titleT = setInterval(() => document.title = (f ^= 1) ? '📞 ' + n + ' is calling' : 'JK Video Call', 900); }
}
window.addEventListener('beforeunload', () => { if (call) send({ t: 'end' }); });

/* ---------- boot ---------- */
renderPeople();
const sess = gstore.get('session', null), sessP = sess && gstore.get('profiles', []).find(p => p.num === sess);
if (sessP) { enter(sessP, null); const cq = qs.get('chat'); if (cq && /^\d{4}$/.test(cq)) openThread(cq); }
})();
</script>
