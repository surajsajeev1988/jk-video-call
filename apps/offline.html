<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JK Video Call</title>
<style>
  html,body{margin:0;height:100%;background:#0b141a;color:#e9edef;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:24px}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#8696a0;max-width:300px}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:14px 44px;background:#00a884;color:#04240f;cursor:pointer}
</style>
</head>
<body>
  <img src="icon-192.png" alt="">
  <h1>No internet</h1>
  <p>JK Video Call needs Wi-Fi or mobile data. It will open by itself when you're back online.</p>
  <button id="retry">Try again</button>
<script>
  // the live app: every installed copy opens this, so it is always the newest version
  const LIVE = 'https://surajsajeev1988.github.io/jk-video-call/';
  const go = () => { location.href = LIVE; };
  document.getElementById('retry').onclick = go;
  addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) fetch(LIVE, { mode: 'no-cors', cache: 'no-store' }).then(go, () => {}); }, 10000);
</script>
</body>
</html>
